[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-cleanroom"
version = "0.1.0"
description = "Agentic pipeline for extracting structured specs from SRS documents"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "langchain>=1.3.4",
    "langchain-openai>=0.3",
    "pypdf>=6.13.0",
    "lxml>=6.1.1",
]

[project.scripts]
cleanroom = "src.cleanroom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

